[project]
name = "pulseq-checks"
version = "0.1.0rc5"
description = "Check a Pulseq sequence against the limits of target scanners"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pypulseq>=1.5.0.post1",
    "numpy",
    "scipy",
    "pulseq-analysis @ git+https://github.com/mdtisdall/pulseq-analysis@v0.1.0rc5",
]

[project.scripts]
pulseq-check = "pulseq_checks.cli:main"

[project.entry-points."pulseq_checks.profile_readers"]
siemens-asc = "pulseq_checks.asc_profile:read_asc_profile"

[project.entry-points."pulseq_checks.models"]
"pns.safe" = "pulseq_checks.safe_model:SAFE_MODEL"

[project.entry-points."pulseq_checks.checks"]
"timing.rasters" = "pulseq_checks.checks.timing:RASTERS"
"timing.pypulseq" = "pulseq_checks.checks.timing:PYPULSEQ"
"gradient.amplitude.axis" = "pulseq_checks.checks.gradient:AMPLITUDE_AXIS"
"gradient.slew.axis" = "pulseq_checks.checks.gradient:SLEW_AXIS"
"gradient.amplitude.any-orientation" = "pulseq_checks.checks.gradient:AMPLITUDE_ANY_ORIENTATION"
"pns.safe" = "pulseq_checks.checks.pns:SAFE"
"acoustic.resonance-energy" = "pulseq_checks.checks.acoustic:RESONANCE_ENERGY"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pulseq_checks"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# pypulseq 1.5.0.post1 with four commits, from the fork (tag pulseq-reports-pin-1, branch
# pulseq-reports-pin): the SAFE PNS filter as a recursion, calculate_pns in chunks, the
# get_block fix for oversampled arbitrary gradients (upstream PR #424), and the read fix of
# upstream #359. TODO.md ("Move from the pypulseq fork to a pypulseq release") lists them.
# uv also applies this source for a project that depends on pulseq-checks by git URL; pip
# does not.
[tool.uv.sources]
pypulseq = { git = "https://github.com/mdtisdall/pypulseq", rev = "a74ab06e51ca09707ff54837cf5ff652f6e69e94" }

[tool.ruff]
line-length = 100
